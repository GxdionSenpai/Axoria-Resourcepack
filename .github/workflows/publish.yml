name: Publish Axoria Pack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest pack and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          source=Path('source-pack.zip')
          if not source.is_file():
              raise SystemExit('Upload source-pack.zip first')
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              assert 'pack.mcmeta' in z.namelist()
          Path('axoria-resourcepack.zip').write_bytes(source.read_bytes())
          sha=hashlib.sha1(source.read_bytes()).hexdigest()
          Path('pack-info.properties').write_text('url=https://github.com/GxdionSenpai/Axoria-Resourcepack/releases/download/latest/axoria-resourcepack.zip\nsha1='+sha+'\n')
          PY
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest axoria-resourcepack.zip --clobber
          else
            gh release create latest axoria-resourcepack.zip --title 'Axoria Resourcepack (aktuell)' --notes 'Automatisch veröffentlicht'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pack-info.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Update pack manifest [skip ci]'
            git push
          fi
