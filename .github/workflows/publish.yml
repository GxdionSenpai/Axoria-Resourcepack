name: Publish Axoria Pack
on:
  push:
    branches: [main]
    paths:
      - 'source-pack.zip'
      - 'build_pack.py'
      - 'audio/**'
      - 'season1_guardian_weapons.b85'
      - 'new_custom_item_art.py'
      - 'premium_generated_atlas/axoria128_item_art.png'
      - 'premium_item_atlas.png.b64'
      - 'backpack.png.b64'
      - 'eissense.png.b64'
      - 'skyblock_menu_book.png.b64'
      - 'axoria_key_*.png.b64'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
concurrency:
  group: axoria-pack-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest pack and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 build_pack.py
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest axoria-resourcepack.zip --clobber
          else
            gh release create latest axoria-resourcepack.zip --title 'Axoria Resourcepack (aktuell)' --notes 'Automatisch veröffentlicht'
          fi
          # Publish an immutable, content-addressed asset before advertising it.
          sha="$(sha1sum axoria-resourcepack.zip | cut -d ' ' -f 1)"
          versioned="axoria-resourcepack-${sha}.zip"
          cp axoria-resourcepack.zip "$versioned"
          gh release upload latest "$versioned" --clobber
          printf 'url=https://github.com/GxdionSenpai/Axoria-Resourcepack/releases/download/latest/%s\nsha1=%s\n' "$versioned" "$sha" > pack-info.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish the exact ZIP and its matching SHA-1 manifest atomically.
          # Clients fetch the immutable release asset matching the advertised hash.
          git add -f pack-info.properties axoria-resourcepack.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Update pack manifest [skip ci]'
            # Rebase onto latest main before push to handle edits made while the job runs.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Failed to publish pack-info.properties after 3 attempts' >&2
                exit 1
              fi
            done
          fi
