name: Publish Axoria Pack
on:
  push:
    branches: [main]
    paths:
      - 'source-pack.zip'
      - 'build_pack.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest pack and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build_pack.py
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest axoria-resourcepack.zip --clobber
          else
            gh release create latest axoria-resourcepack.zip --title 'Axoria Resourcepack (aktuell)' --notes 'Automatisch veröffentlicht'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pack-info.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Update pack manifest [skip ci]'
            # Rebase onto latest main before push to handle edits made while the job runs.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Failed to publish pack-info.properties after 3 attempts' >&2
                exit 1
              fi
            done
          fi
