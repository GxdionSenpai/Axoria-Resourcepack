name: Publish Axoria Pack
on:
  push:
    branches: [main]
    paths:
      - 'source-pack.zip'
      - 'build_pack.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest pack and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build_pack.py
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest axoria-resourcepack.zip --clobber
          else
            gh release create latest axoria-resourcepack.zip --title 'Axoria Resourcepack (aktuell)' --notes 'Automatisch veröffentlicht'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pack-info.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Update pack manifest [skip ci]'
            git push
          fi
